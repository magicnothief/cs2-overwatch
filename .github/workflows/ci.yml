# Tests on Linux and Windows, then installs the app the way a user would and
# lets it fetch its small downloads (the detector model, Source2Viewer), so a
# broken Windows path or a moved download shows up here first.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install the app and the test tools (no training packages)
        run: uv sync --no-default-groups --group test
      - name: Tests
        run: uv run --no-sync pytest -q

  install:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install as a user would
        run: uv tool install --python 3.12 .
      - name: The command runs
        run: uv tool run --from . overwatch --help
      - name: First-run downloads work (without the 2.8 GB judge)
        run: uv tool run --from . overwatch setup --no-judge

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: pip-audit against the locked tree (non-blocking until 2026-10-03, see MAG-9)
        continue-on-error: true
        run: uvx pip-audit --strict -r <(uv export --no-default-groups --format requirements-txt)
