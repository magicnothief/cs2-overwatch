<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overwatch annotation</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6a65; --line: #e2e0da;
    --accent: #2f62c9; --accent-ink: #ffffff;
    --clean: #2c8a57; --unclear: #b07d12; --cheat: #c23b2e;
    --visible: rgba(44, 138, 87, 0.13); --hidden: rgba(28, 28, 26, 0.045);
    --warn-bg: #fff4dc; --warn-ink: #7a5405;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --ink: #ebeae5; --muted: #a09e97; --line: #34332f;
      --accent: #6b9bff; --accent-ink: #0e1422;
      --clean: #53c285; --unclear: #e0ad3f; --cheat: #f06a5d;
      --visible: rgba(83, 194, 133, 0.16); --hidden: rgba(255, 255, 255, 0.04);
      --warn-bg: #3a2e12; --warn-ink: #f3cf7c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; gap: 20px; align-items: center;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  .progress { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .bar { flex: 1; max-width: 320px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.3s; }
  .keys { color: var(--muted); font-size: 12px; }
  kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }

  main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .panel + .panel { margin-top: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  pre { font: 12.5px/1.55 var(--mono); margin: 0; white-space: pre-wrap; word-break: break-word; font-variant-ligatures: none; }
  .title { font-size: 15px; font-weight: 600; font-family: var(--sans); }
  .hidden-word { color: var(--muted); }
  .visible-word { color: var(--clean); font-weight: 600; }
  .shot { color: var(--cheat); font-weight: 700; }
  .context { color: var(--accent); }
  .sev { color: var(--cheat); font-weight: 700; }
  .moment { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 12px 0; border-top: 1px dashed var(--line); }
  .moment:first-of-type { border-top: none; }
  @media (max-width: 1250px) { .moment { grid-template-columns: 1fr; } }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .cap { font-size: 11px; color: var(--muted); margin-top: 2px; }
  svg text { fill: var(--muted); font: 10px var(--sans); }
  .axis { stroke: var(--line); }
  .trace { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .dot-visible { fill: var(--clean); } .dot-hidden { fill: var(--muted); }
  .shotline { stroke: var(--cheat); stroke-dasharray: 3 3; }
  .band-visible { fill: var(--visible); } .band-hidden { fill: var(--hidden); }

  aside { position: sticky; top: 64px; align-self: start; }
  @media (max-width: 980px) { aside { position: static; } }
  .prob { display: flex; align-items: baseline; gap: 12px; }
  .prob output { font: 600 34px/1 var(--sans); font-variant-numeric: tabular-nums; min-width: 2.4ch; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; color: #fff; }
  .chip.clean { background: var(--clean); } .chip.unclear { background: var(--unclear); } .chip.cheating { background: var(--cheat); }
  input[type=range] { width: 100%; margin: 12px 0 4px; accent-color: var(--ink); }
  .bands { display: flex; font-size: 11px; color: var(--muted); }
  .bands span { text-align: center; border-top: 3px solid; padding-top: 2px; }
  label.field { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 6px; }
  .types { display: flex; flex-wrap: wrap; gap: 6px; }
  .types label { border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; user-select: none; }
  .types input { display: none; }
  .types input:checked + span { font-weight: 700; }
  .types label:has(input:checked) { border-color: var(--ink); background: var(--bg); }
  .types label:has(input:disabled) { opacity: 0.4; cursor: not-allowed; }
  .row { position: relative; margin-bottom: 6px; }
  .row input, textarea {
    width: 100%; font: 13px var(--sans); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 44px 7px 9px;
  }
  textarea { padding: 7px 9px; min-height: 52px; resize: vertical; }
  .row input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .count { position: absolute; right: 8px; top: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--cheat); font-weight: 700; }
  .warn { font-size: 12px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 4px 8px; margin: -2px 0 6px; }
  .phrases { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .phrases button {
    font: 12px var(--sans); text-align: left; border: 1px dashed var(--line); background: transparent;
    color: var(--ink); border-radius: 6px; padding: 4px 8px; cursor: pointer; max-width: 100%;
  }
  .phrases button:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  button.primary, button.secondary {
    font: 600 13px var(--sans); border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.secondary { background: transparent; color: var(--ink); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: var(--cheat); font-size: 12px; margin-top: 8px; min-height: 1em; }
  .reveal { border-left: 4px solid var(--line); }
  .reveal.agree { border-left-color: var(--clean); } .reveal.disagree { border-left-color: var(--unclear); }
  .reveal ul { margin: 6px 0 0; padding-left: 18px; }
  .reveal li { margin: 2px 0; }
  .muted { color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Overwatch · annotation</h1>
  <div class="progress">
    <div class="bar"><div id="bar"></div></div>
    <span id="progress-text">…</span>
    <span id="agree-text"></span>
  </div>
  <span class="keys"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> save · <kbd>N</kbd> next · <kbd>S</kbd> skip · <kbd>B</kbd> back</span>
</header>

<main>
  <section>
    <div class="panel">
      <h2>What the judge model reads</h2>
      <div id="evidence"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <aside>
    <form class="panel" id="form" autocomplete="off">
      <h2>Your verdict</h2>
      <div class="prob">
        <output id="prob-out">50</output><span class="muted">% certain they cheated</span>
        <span id="verdict-chip" class="chip unclear">unclear</span>
      </div>
      <input type="range" id="prob" min="0" max="100" value="50" aria-label="probability of cheating">
      <div class="bands" id="bands"></div>

      <label class="field">Cheat type <span class="hint">(only when accusing)</span></label>
      <div class="types" id="types"></div>

      <label class="field">Reasons <span class="hint">— cite measurements from the evidence</span></label>
      <div id="reasons"></div>
      <div class="hint">Outside the usual clean range — click to insert, then edit:</div>
      <div class="phrases" id="reason-phrases"></div>

      <label class="field">Caveats <span class="hint">— what would change your mind</span></label>
      <div id="caveats"></div>
      <div class="phrases" id="caveat-phrases"></div>

      <label class="field" for="note">Note <span class="hint">— not training data: what was missing, confusing or wrong?</span></label>
      <textarea id="note"></textarea>

      <div class="actions">
        <button type="submit" class="primary" id="save">Save &amp; reveal</button>
        <button type="button" class="secondary" id="skip">Skip</button>
        <button type="button" class="secondary" id="back" title="the case you saved last">← Back</button>
      </div>
      <div class="error" id="error"></div>
    </form>
    <div class="panel reveal" id="reveal" hidden></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TYPES = ["none", "aimbot", "wallhack", "triggerbot", "mixed"];
const state = { data: null, skipped: [], history: [], started: 0, limits: null };

const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function verdictFor(p) {
  const l = state.limits;
  if (p < l.clean_below) return "clean";
  if (p > l.cheating_above) return "cheating";
  return "unclear";
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

/* ---------- evidence ---------- */

function highlight(text) {
  return escape(text)
    .replace(/^(\s*context:.*)$/gm, '<span class="context">$1</span>')
    .replace(/\[(impossible|strong)\]/g, '<span class="sev">[$1]</span>')
    .replace(/&lt;- shot/g, '<span class="shot">&lt;- shot</span>')
    .replace(/\b(hidden)\b/g, '<span class="hidden-word">$1</span>')
    .replace(/\b(visible)(\s*(?:<|$))/gm, '<span class="visible-word">$1</span>$2');
}

function chart(trajectory) {
  if (!trajectory || !trajectory.length) return "";
  const W = 300, H = 128, L = 30, R = 8, T = 8, B = 20;
  const x0 = -1500, x1 = 250;
  const top = Math.min(60, Math.max(10, Math.ceil(Math.max(...trajectory.map((p) => p.angle)) / 5) * 5));
  const X = (ms) => L + ((ms - x0) / (x1 - x0)) * (W - L - R);
  const Y = (a) => T + (1 - Math.min(a, top) / top) * (H - T - B);
  let bands = "";
  trajectory.forEach((p, i) => {
    const next = trajectory[i + 1];
    const a = X(p.ms), b = next ? X(next.ms) : X(x1);
    bands += `<rect class="band-${p.visible ? "visible" : "hidden"}" x="${a}" y="${T}" width="${Math.max(0, b - a)}" height="${H - T - B}"/>`;
  });
  const path = trajectory.map((p, i) => `${i ? "L" : "M"}${X(p.ms).toFixed(1)},${Y(p.angle).toFixed(1)}`).join("");
  const dots = trajectory.map((p) => `<circle class="dot-${p.visible ? "visible" : "hidden"}" cx="${X(p.ms)}" cy="${Y(p.angle)}" r="2.4"/>`).join("");
  const ticks = [-1500, -1000, -500, 0].map((ms) =>
    `<text x="${X(ms)}" y="${H - 6}" text-anchor="middle">${ms === 0 ? "shot" : ms / 1000 + "s"}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="crosshair distance from the enemy's head over time">
    ${bands}
    <line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>
    <text x="${L - 4}" y="${Y(top) + 4}" text-anchor="end">${top}°</text>
    <text x="${L - 4}" y="${Y(0) + 3}" text-anchor="end">0°</text>
    <line class="shotline" x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H - B}"/>
    <path class="trace" d="${path}"/>${dots}${ticks}
  </svg><div class="cap">degrees between crosshair and head · green = enemy visible, grey = behind cover</div></div>`;
}

function renderEvidence(data) {
  const sections = data.evidence.split("\n\n");
  const moments = data.case.moments || [];
  let html = "";
  sections.forEach((section, n) => {
    if (n === 0) {
      const [first, ...rest] = section.split("\n");
      html += `<pre><span class="title">${escape(first)}</span>\n${highlight(rest.join("\n"))}</pre>`;
    } else if (section.startsWith("MOST SUSPICIOUS KILLS")) {
      const lines = section.split("\n");
      html += `<pre style="margin-top:14px">${escape(lines[0])}</pre>`;
      const groups = [];
      lines.slice(1).forEach((line) => {
        if (/^\d+\. /.test(line)) groups.push([line]); else if (groups.length) groups.at(-1).push(line);
      });
      groups.forEach((group, i) => {
        html += `<div class="moment"><pre>${highlight(group.join("\n"))}</pre>${chart(moments[i] && moments[i].trajectory)}</div>`;
      });
    } else {
      html += `<pre style="margin-top:14px">${highlight(section)}</pre>`;
    }
  });
  $("evidence").innerHTML = html;
}

/* ---------- form ---------- */

function sentenceRows(container, count, values) {
  container.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<input type="text"><span class="count"></span>`;
    const input = row.querySelector("input");
    input.value = values[i] || "";
    input.addEventListener("input", () => updateRow(row));
    container.appendChild(row);
    const warn = document.createElement("div");
    warn.className = "warn";
    warn.hidden = true;
    container.appendChild(warn);
    updateRow(row);
  }
}

/* A number the evidence does not contain is an invented number; the model must never
   learn to write one. Same check as tests/test_judge_targets.py. */
function unseenNumbers(sentence) {
  const evidence = state.data.evidence.replace(/,/g, "");
  return (sentence.match(/\d[\d.]*%?/g) || [])
    .map((t) => t.replace(/[%.,]+$/, ""))
    .filter((t) => t.replace(".", "").length > 2 && !evidence.includes(t));
}

function updateRow(row) {
  const input = row.querySelector("input"), count = row.querySelector(".count");
  const n = input.value.length, max = state.limits.sentence;
  count.textContent = n ? `${n}/${max}` : "";
  count.classList.toggle("over", n > max);
  const warn = row.nextElementSibling;
  const unseen = input.value ? unseenNumbers(input.value) : [];
  warn.hidden = !unseen.length;
  warn.textContent = unseen.length ? `not in the evidence: ${unseen.join(", ")} — the model must not learn to invent numbers` : "";
}

function phraseButtons(container, phrases, target) {
  container.innerHTML = "";
  phrases.forEach((text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => {
      const inputs = [...target.querySelectorAll("input")];
      const slot = inputs.find((i) => !i.value.trim());
      if (!slot) return;
      slot.value = text;
      slot.dispatchEvent(new Event("input"));
      slot.focus();
    });
    container.appendChild(b);
  });
}

function setProbability(p) {
  $("prob").value = p;
  $("prob-out").textContent = p;
  const v = verdictFor(p);
  const chip = $("verdict-chip");
  chip.textContent = v;
  chip.className = `chip ${v}`;
  document.querySelectorAll('#types input').forEach((input) => {
    input.disabled = v !== "cheating" && input.value !== "none";
  });
  if (v !== "cheating") document.querySelector('#types input[value="none"]').checked = true;
}

function renderBands() {
  const l = state.limits;
  $("bands").innerHTML =
    `<span style="width:${l.clean_below}%;border-color:var(--clean)">clean</span>` +
    `<span style="width:${l.cheating_above - l.clean_below + 1}%;border-color:var(--unclear)">unclear</span>` +
    `<span style="flex:1;border-color:var(--cheat)">cheating</span>`;
}

function fillForm(data) {
  const a = data.annotation && data.annotation.verdict;
  $("types").innerHTML = TYPES.map((t) =>
    `<label><input type="radio" name="type" value="${t}"><span>${t}</span></label>`).join("");
  sentenceRows($("reasons"), state.limits.reasons, a ? a.reasons : []);
  sentenceRows($("caveats"), state.limits.caveats, a ? a.caveats : []);
  phraseButtons($("reason-phrases"), data.phrases.reasons, $("reasons"));
  phraseButtons($("caveat-phrases"), data.phrases.caveats, $("caveats"));
  $("note").value = data.annotation ? data.annotation.note : "";
  setProbability(a ? a.probability : 50);
  document.querySelector(`#types input[value="${a ? a.cheat_type : "none"}"]`).checked = true;
  $("error").textContent = "";
}

/* ---------- reveal ---------- */

function showReveal(reveal, mine) {
  const g = reveal.generated;
  const box = $("reveal");
  box.hidden = false;
  box.className = `panel reveal ${reveal.agrees ? "agree" : "disagree"}`;
  const label = reveal.label === "cheater" ? "VAC-banned (cheater)" : "not banned (clean)";
  box.innerHTML = `
    <h2>Revealed</h2>
    <div><b>Ban label:</b> ${label}</div>
    <div style="margin-top:6px"><b>Generated target:</b>
      <span class="chip ${g.verdict}">${g.verdict}</span> ${g.probability}%
      ${g.cheat_type !== "none" ? "· " + g.cheat_type : ""}</div>
    <ul>${g.reasons.map((r) => `<li>${escape(r)}</li>`).join("")}</ul>
    ${g.caveats.length ? `<div class="muted" style="margin-top:6px">caveats: ${g.caveats.map(escape).join("; ")}</div>` : ""}
    <div style="margin-top:10px"><b>${reveal.agrees ? "Same verdict" : "Different verdict"}</b>
      <span class="muted">— you said ${mine.verdict} ${mine.probability}%</span></div>
    <div class="actions"><button class="primary" id="next">Next case →</button></div>`;
  $("next").addEventListener("click", nextCase);
  $("next").focus();
}

/* ---------- flow ---------- */

function renderProgress(p) {
  $("bar").style.width = `${Math.min(100, (100 * p.done) / p.goal)}%`;
  $("progress-text").textContent = `${p.done} / ${p.goal} annotated (${p.total} cases)`;
}

async function refreshStats() {
  const s = await api("/api/stats");
  renderProgress(s.progress);
  $("agree-text").textContent = s.agree == null ? "" :
    `· agreement with generated targets ${Math.round(100 * s.agree)}%` + (s.stale ? ` · ${s.stale} stale` : "");
}

async function load(key) {
  const data = await api(`/api/case/${encodeURI(key)}`);
  state.data = data;
  state.limits = data.limits;
  state.started = performance.now();
  renderBands();
  renderEvidence(data);
  fillForm(data);
  $("reveal").hidden = true;
  if (data.reveal) showReveal(data.reveal, data.annotation.verdict);
  window.scrollTo({ top: 0 });
}

async function nextCase() {
  const res = await api(`/api/next?skip=${encodeURIComponent(state.skipped.join(","))}`);
  renderProgress(res.progress);
  if (!res.key) {
    $("evidence").innerHTML = `<div class="empty">Every case is annotated or skipped. Thank you.</div>`;
    $("form").hidden = true;
    return;
  }
  await load(res.key);
}

async function save(event) {
  event.preventDefault();
  const values = (id) => [...$(id).querySelectorAll("input")].map((i) => i.value);
  const body = {
    key: state.data.key,
    evidence_sha: state.data.evidence_sha,
    probability: Number($("prob").value),
    cheat_type: document.querySelector("#types input:checked").value,
    reasons: values("reasons"),
    caveats: values("caveats"),
    note: $("note").value,
    seconds: Math.round((performance.now() - state.started) / 100) / 10,
  };
  $("save").disabled = true;
  try {
    const res = await api("/api/annotations", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    $("error").textContent = "";
    if (state.history.at(-1) !== body.key) state.history.push(body.key);
    renderProgress(res.progress);
    showReveal(res.reveal, res.annotation.verdict);
    refreshStats();
  } catch (err) {
    $("error").textContent = err.message;
  } finally {
    $("save").disabled = false;
  }
}

$("prob").addEventListener("input", (e) => setProbability(Number(e.target.value)));
$("form").addEventListener("submit", save);
$("skip").addEventListener("click", () => { state.skipped.push(state.data.key); nextCase(); });
$("back").addEventListener("click", () => {
  const key = [...state.history].reverse().find((k) => k !== state.data.key);
  if (key) load(key);
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { $("form").requestSubmit(); return; }
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== "range") return;
  if (e.key === "n" && !$("reveal").hidden) nextCase();
  if (e.key === "s") $("skip").click();
  if (e.key === "b") $("back").click();
});

nextCase().then(refreshStats).catch((err) => {
  $("evidence").innerHTML = `<div class="empty">Could not reach the server: ${escape(err.message)}</div>`;
});
</script>
</body>
</html>
